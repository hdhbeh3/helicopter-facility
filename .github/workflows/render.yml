name: Render Helicopter Facility Short

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract helicopter project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -name "helicopter_facility_remotion_project.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: helicopter_facility_remotion_project.zip not found!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE"

          if [ ! -f package.json ]; then
            echo "ERROR: package.json is still missing after extraction!"
            find . -maxdepth 3 -name package.json
            exit 1
          fi

          echo "Project extracted successfully."

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2 libgl1 libgles2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npm run typecheck

      - name: Timeline tests
        run: npm test

      - name: Smoke test
        run: npm run smoke

      - name: Upload smoke frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke_frames
          path: out/smoke_*.png
          if-no-files-found: ignore

      - name: Render helicopter video
        run: npm run render

      - name: Verify output
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,duration -of default=nw=1 out/helicopter_final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: helicopter_final
          path: out/helicopter_final.mp4
          retention-days: 14
          
