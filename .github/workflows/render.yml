
name: Render Helicopter Facility Short

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', '.github/workflows/render.yml']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chrome/Remotion system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2 libpango-1.0-0 libcairo2 libgl1 libgles2
      - run: npm install --no-audit --no-fund
      - name: TypeScript type check
        run: npm run typecheck
      - name: Timeline + camera framing tests
        run: npm test
      - name: Smoke test (2 stills, same flags as the render)
        run: npm run smoke
      - name: Upload smoke frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke_frames
          path: out/smoke_*.png
          if-no-files-found: ignore
      - name: Render 1080x1920 / 30 fps / H.264
        run: npm run render
      - name: Verify output
        run: ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,duration -of default=nw=1 out/helicopter_final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: helicopter_final
          path: out/helicopter_final.mp4
          retention-days: 14
          
